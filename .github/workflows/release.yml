name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the GitHub Release from the tag
  id-token: write # npm provenance attestation (OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json#packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20/22: npm trusted publishing (OIDC) needs npm >= 11.5.1,
          # and only Node 24 bundles it (20 -> npm 10.8.2, 22 -> npm 10.9.8).
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run sync-versions
      - run: git diff --exit-code # a tag with unsynced pins must not ship
      - run: pnpm exec vitest run
      - name: release gate (tag/version, calibration)
        run: node scripts/release-gate.mjs
      # install is pnpm's; the publish stays on the npm CLI, whose provenance
      # + OIDC path is the proven one (pnpm/pnpm#11513, pnpm/pnpm#11566).
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
