name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub Release from the tag
  id-token: write   # npm provenance attestation (OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm run sync-versions
      - run: git diff --exit-code   # a tag with unsynced pins must not ship
      - run: npx vitest run
      - name: release gate (tag/version, calibration)
        run: node scripts/release-gate.mjs
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
